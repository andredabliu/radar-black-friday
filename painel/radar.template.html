<title>Radar Black Friday</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Style: true-black flat (deliberately single dark theme: it is the Black Friday).
   Shell: ruled T-frame. Sidebar 220 + 1px rule; canvas gutter 29px each side.
   Overview grid at 1440: canvas 1440-221-58 = 1161; lower row 2fr/1fr with one 14px gap: 765.3 + 14 + 381.7 = 1161. */
:root{
  color-scheme:dark;
  --ground:#000000; --surface:#111111; --raised:#2a2a2a; --border:#1a1a1a; --rule:#1c1c1c; --control:#444444;
  --text:#ffffff; --muted:#b4b4b4; --faint:#949494; --nav:#bbbbbb;
  --accent:#ff6b2c;            /* a cor da etiqueta de preço: só em dados */
  --positive:#3fc07a; --negative:#e5566f; --warning:#e5a93b;
  --pill-positive-bg:#172a1d; --pill-positive-ink:#3fc07a;
  --pill-negative-bg:#2c1a20; --pill-negative-ink:#e5566f;
  --pill-warning-bg:#2b2414; --pill-warning-ink:#e5a93b;
  --pill-neutral-bg:#222222; --pill-neutral-ink:#ffffff;
  --chart-1:#ff6b2c; --chart-2:#e6e6e6; --chart-muted:#6b6b6b; --chart-track:#2a2a2a;
  --grid:#2b2b2b; --axis-ink:#949494; --ink:#ffffff; --chart-span:.12;
  --tile:#ffffff;              /* fundo das fotos de produto, que vêm em branco */
  --radius-card:20px; --radius-inner:12px; --radius-control:999px;
  --sidebar:220px; --gap:14px; --pad:22px; --gutter:29px; --control-height:36px;
  --font:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-title:20px; --fs-section:16px; --fs-kpi:24px; --fs-lead:32px; --fs-body:14px; --fs-small:12px;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--text)}
body{font-family:var(--font);font-size:var(--fs-body);line-height:20px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:6px}

/* shell */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.side{border-right:1px solid var(--rule);padding:0 0 24px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-left:env(safe-area-inset-left,0px)}
.brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--rule);font-weight:600;font-size:15px}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;padding:16px 10px 0;gap:0}
.nav .group{font-size:12px;color:var(--faint);padding:22px 10px 8px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;padding:7px 10px;border-radius:8px;color:var(--nav);transition:color .15s}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text)}
.nav a .r{font-size:12px;color:var(--faint);flex:none}
.nav a .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .foot{margin-top:auto;padding:0 10px;display:flex;flex-direction:column}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:64px;border-bottom:1px solid var(--rule);display:flex;align-items:stretch;position:sticky;top:env(safe-area-inset-top,0px);background:var(--ground);z-index:5;padding-right:env(safe-area-inset-right,0px)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 var(--gutter);color:var(--muted);white-space:nowrap;overflow:hidden}
.crumb b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--control)}
.bf{display:flex;align-items:center;gap:12px;padding:0 var(--gutter);border-left:1px solid var(--rule);white-space:nowrap}
.bf .d{font-size:var(--fs-kpi);font-weight:500;line-height:1}
.bf .t{font-size:12px;color:var(--muted);line-height:16px}
.menu-btn{display:none}
.bf .ts{display:none;font-size:12px;color:var(--muted)}
.canvas{padding:28px var(--gutter) 56px;display:flex;flex-direction:column;gap:var(--gap)}

/* title row */
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:10px}
.title h1{font-size:var(--fs-title);font-weight:600;margin:0;line-height:28px}
.title p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.title p b{color:var(--text);font-weight:500}
.stamp{font-size:12px;color:var(--faint);white-space:nowrap}
.back{color:var(--muted);font-size:13px;display:inline-flex;gap:6px;margin-bottom:6px}
.back:hover{color:var(--text)}

.card{background:var(--surface);border-radius:var(--radius-card);padding:var(--pad);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:var(--fs-section);font-weight:500;margin:0}
.card-h .meta{font-size:12px;color:var(--faint)}

/* KPI strip: one container split by rules */
.kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;padding:0}
.kpis > div{padding:20px var(--pad);border-left:1px solid var(--raised);min-width:0}
.kpis > div:first-child{border-left:0}
.kpis .k{font-size:13px;color:var(--muted)}
.kpis .v{font-size:var(--fs-kpi);font-weight:500;margin-top:6px;line-height:30px}
.kpis .v.lead{font-size:var(--fs-lead);line-height:38px}
.kpis .v small{font-size:14px;color:var(--faint);font-weight:400}
.kpis .s{font-size:12px;color:var(--faint);margin-top:4px}

/* watchlist */
.wl{padding:8px var(--pad)}
.wl-head,.row{display:grid;grid-template-columns:72px minmax(0,1.6fr) minmax(170px,1.2fr) 120px 130px 128px;gap:18px;align-items:center}
.wl-head{font-size:12px;color:var(--faint);padding:12px 0 10px;border-bottom:1px solid var(--raised)}
.wl-head .n,.row .n{text-align:right}
.row{padding:14px 0;border-bottom:1px solid var(--rule);cursor:pointer;position:relative}
.row:last-child{border-bottom:0}
.row:hover .name{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control)}
.thumb{width:72px;height:72px;border-radius:var(--radius-inner);background:var(--tile);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:contain;padding:6px}
.thumb.code{background:var(--raised);color:var(--text);font-weight:600;font-size:15px;letter-spacing:.02em}
.thumb span{color:#555;font-weight:600;font-size:12px}
.name{font-weight:500;font-size:15px;line-height:20px;margin:0}
.sub{font-size:12px;color:var(--faint);margin-top:3px;line-height:16px}
.price{font-size:18px;font-weight:500;line-height:24px}
.price.big{font-size:36px;line-height:40px;letter-spacing:-.01em}
.chg{font-size:12px;line-height:16px;margin-top:2px;color:var(--faint)}
.chg.good{color:var(--positive)} .chg.bad{color:var(--negative)}
.goal{font-size:14px}
.goal .sub{margin-top:2px}
.act{justify-self:end}
.ghost{display:inline-flex;align-items:center;gap:6px;height:var(--control-height);padding:0 14px;border-radius:var(--radius-control);border:1px solid var(--control);font-size:13px;white-space:nowrap;transition:border-color .15s,background .15s}
.ghost:hover{border-color:var(--muted)}
.ghost:active{background:var(--raised)}
.primary{display:inline-flex;align-items:center;gap:8px;height:var(--control-height);padding:0 18px;border-radius:var(--radius-control);background:var(--text);color:#000;font-weight:500;font-size:14px;white-space:nowrap;border:0;cursor:pointer;transition:opacity .15s}
.primary:hover{opacity:.88}
.primary:active{opacity:.75}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap;flex:none;background:var(--pill-neutral-bg);color:var(--pill-neutral-ink)}
.pill.pos{background:var(--pill-positive-bg);color:var(--pill-positive-ink)}
.pill.warn{background:var(--pill-warning-bg);color:var(--pill-warning-ink)}
.pill.neg{background:var(--pill-negative-bg);color:var(--pill-negative-ink)}

/* signature: a régua de preços (todas as lojas num eixo, com o alvo) */
.ruler{width:100%;height:44px;display:block;overflow:visible}
.ruler text{font-family:var(--font);font-size:11px;fill:var(--faint);font-variant-numeric:tabular-nums}

.lower{display:grid;grid-template-columns:2fr 1fr;gap:var(--gap);align-items:start}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;gap:4px;background:var(--ground);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--nav);height:30px;padding:0 12px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.chart{min-height:0}
.chart-note{border:1px dashed var(--control);border-radius:12px;padding:18px;color:var(--muted);font-size:13px;line-height:20px}
.chart-note b{color:var(--text);font-weight:500}
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:20px}
.alert .pill{margin-top:0}
.rp{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.pill.rec{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.recline{margin-top:12px;padding-top:12px;border-top:1px solid var(--raised);font-size:14px}
.recline .sub{margin-top:4px}
.where .pill{margin-left:6px;vertical-align:1px}
.alert-empty{color:var(--muted);font-size:13px}
.ref{margin-top:16px;padding-top:14px;border-top:1px solid var(--raised);display:flex;flex-direction:column;gap:8px}
.ref h3{font-size:13px;font-weight:500;color:var(--muted);margin:0}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.kv span:first-child{color:var(--muted);min-width:0}

/* product view */
.pv{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--gap);align-items:start}
.photo{background:var(--tile);border-radius:var(--radius-card);aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden;max-width:100%}
.photo img{width:100%;height:100%;object-fit:contain;padding:28px}
.specs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.specs li{padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.specs li:last-child{border-bottom:0}
.stack{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.answer{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between}
.answer .where{color:var(--muted);margin-top:6px}
.answer .where b{color:var(--text);font-weight:500}
.target{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--raised)}
.target label{font-size:13px;color:var(--muted)}
.target input{width:132px;height:var(--control-height);border-radius:var(--radius-control);border:1px solid var(--control);background:var(--ground);color:var(--text);padding:0 14px;font:inherit;font-variant-numeric:tabular-nums}
.target input:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.target .msg{font-size:13px;color:var(--muted)}
.target .msg.good{color:var(--positive)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:400;color:var(--faint);text-align:left;padding:0 10px 10px;white-space:nowrap}
td{padding:12px 10px;border-top:1px solid var(--rule);vertical-align:top}
th:first-child,td:first-child{padding-left:0} th:last-child,td:last-child{padding-right:0}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.best td.store b{color:var(--accent)}
td.store b{font-weight:500}
td.store .sub{max-width:46ch;font-size:13px;line-height:18px}
td .l{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.note{color:var(--muted);font-size:13px;line-height:20px;margin-top:14px}
.state{padding:32px;color:var(--muted);text-align:center;border:1px dashed var(--control);border-radius:var(--radius-card)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--text);color:#000;border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%)}
.chart svg text{font-family:var(--font)}

/* tablet */
@media (max-width:1100px){
  .wl-head,.row{grid-template-columns:64px minmax(0,1.5fr) 120px 130px 112px}
  .wl-head .c-ruler,.row .c-ruler{display:none}
  .thumb{width:64px;height:64px}
  .lower{grid-template-columns:1fr}
  .pv{grid-template-columns:1fr}
  .photo{aspect-ratio:16/10}
  .pv > .stack:first-child{order:2}
}
/* phone: o menu lateral vira uma folha */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0;z-index:30;background:var(--ground);height:auto;border-right:0;display:none;padding-top:env(safe-area-inset-top,0px)}
  .side.open{display:flex}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:max(6px,env(safe-area-inset-left,0px));border:0;background:transparent;cursor:pointer;flex:none;align-self:center}
  .side .close{display:inline-flex}
  .top{height:56px}
  .crumb{padding-left:4px}
  .bf{padding:0 max(16px,env(safe-area-inset-right,0px)) 0 14px}
  .bf .t{display:none}
  .bf .ts{display:inline}
  .bf{gap:8px}
  .canvas{padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
  .kpis{grid-template-columns:1fr 1fr}
  .kpis > div{border-left:0;border-top:1px solid var(--raised)}
  .kpis > div:nth-child(-n+2){border-top:0}
  .kpis > div:nth-child(2n){border-left:1px solid var(--raised)}
  .kpis > div{padding:16px}
  .wl{padding:4px 16px}
  .wl-head{display:none}
  .row{grid-template-columns:64px minmax(0,1fr) auto;grid-template-areas:"t i p" "t g g" "t r r";gap:6px 14px}
  .row .c-thumb{grid-area:t;align-self:start}
  .row .c-info{grid-area:i}
  .row .c-price{grid-area:p}
  .row .c-goal{grid-area:g;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .row .c-goal .sub{margin:0}
  .row .act{display:none}
  .row .c-ruler{display:block;grid-area:r;padding-top:4px}
  .price.big{font-size:32px;line-height:36px}
  .card{padding:18px 16px}
  td.store .sub{max-width:28ch}
}
.side .close{display:none;position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:44px;height:44px;border:0;background:transparent;cursor:pointer;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="side" id="side" aria-label="Navegação">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 4.5A2.5 2.5 0 0 1 4.5 2h7.3c.7 0 1.3.3 1.8.7l6.7 6.7a2.5 2.5 0 0 1 0 3.5l-7.1 7.1a2.5 2.5 0 0 1-3.5 0L2.7 13.4A2.5 2.5 0 0 1 2 11.6z" fill="#ff6b2c"/><circle cx="7" cy="7" r="1.9" fill="#000"/></svg>
      Radar BF
    </div>

      <button class="menu-btn" id="menu" aria-label="Abrir menu" aria-controls="side" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></button>

<script>/*CHARTS*/</script>
<script>
document.documentElement.lang = "pt-BR";
const BF = new Date("2026-11-27T00:00:00-03:00");
const REPO = "/*REPO*/";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe = u => /^https:\/\//i.test(u || "") ? u : null;
const brl = (v, d = 2) => v == null || isNaN(v) ? "—" : v.toLocaleString("pt-BR", {style:"currency", currency:"BRL", minimumFractionDigits:d, maximumFractionDigits:d});
const brl0 = v => brl(v, 0);
const MINUS = "−";
const signed = v => (v > 0 ? "+" : v < 0 ? MINUS : "") + brl(Math.abs(v));
const day = s => { const [y, m, d] = (s || "").split("-"); return d ? `${d}/${m}` : s; };
const stamp = iso => { if (!iso) return "—"; const d = new Date(iso); if (isNaN(d)) return "—";
  const today = new Date(); const same = d.toDateString() === today.toDateString();
  const t = d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
  return same ? `hoje, ${t}` : `${d.toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"})}, ${t}`; };

let viagens = [], vmeta = null;
let offerSort = "rec", tripSort = "rec";
try { offerSort = localStorage.getItem("rbf-osort") || "rec"; tripSort = localStorage.getItem("rbf-tsort") || "rec"; } catch (e) {}
let loaded = false, products = [], meta = null, lojas = {}, lojasAt = null, db = null, chartPick = null;
const PUBLIC_URL = "/*PUBLIC*/";

/* ---------- dados ---------- */
const eff = o => { const p = [o.preco_pix, o.preco].filter(v => typeof v === "number" && v > 0); return p.length ? Math.min(...p) : null; };
const usable = o => o.verificado !== false && o.disponivel !== false && eff(o) != null;
function best(p) { let b = null; for (const o of p.ofertas || []) if (usable(o)) { const v = eff(o); if (!b || v < b.v) b = {v, o}; } return b; }
const hist = p => (p.historico || []).filter(h => typeof h.menor === "number").sort((a, b) => a.data < b.data ? -1 : 1);
function vsPrev(p) { const h = hist(p); if (h.length < 2) return null; return h.at(-1).menor - h.at(-2).menor; }
const hasGoal = p => typeof p.preco_alvo === "number" && p.preco_alvo > 0;
const prevStore = (p, loja) => { const h = hist(p); if (h.length < 2) return null; const x = h.at(-2).precos; return x && typeof x[loja] === "number" ? x[loja] : null; };

function chgLine(p) {
  const c = vsPrev(p);
  if (c == null) return `<div class="chg">1ª checagem</div>`;
  if (c === 0) return `<div class="chg">igual a ontem</div>`;
  return `<div class="chg ${c < 0 ? "good" : "bad"}">${signed(c)} vs ontem</div>`;
}
function goalCell(p, b) {
  if (!hasGoal(p)) return `<div class="goal">—</div><div class="sub">sem alvo</div>`;
  const gap = b ? b.v - p.preco_alvo : null;
  if (gap != null && gap <= 0) return `<div class="goal"><span class="pill pos">No alvo</span></div><div class="sub num">alvo ${brl0(p.preco_alvo)}</div>`;
  return `<div class="goal num">${brl0(p.preco_alvo)}</div><div class="sub num">${gap == null ? "sem preço hoje" : "faltam " + brl(gap)}</div>`;
}

/* ---------- reputação da loja (Reclame Aqui) ---------- */
function rep(loja) {
  if (!loja) return null; const keys = Object.keys(lojas).sort((a, b) => b.length - a.length);
  const k = keys.find(k => loja === k || loja.startsWith(k + " ") || loja.startsWith(k + "(") ); return k ? {nome: k, ...lojas[k]} : null;
}
function repKind(r) { const s = (r?.ra_selo || "").toLowerCase();
  if (!r || r.ra_nota == null) return ""; if (/ra1000|ótimo|otimo|bom/.test(s)) return "pos"; if (/regular/.test(s)) return "warn"; if (/ruim|não recomendada|nao recomendada/.test(s)) return "neg"; return ""; }
function repPill(loja, short = false) { const r = rep(loja);
  if (!r) return `<span class="pill" title="Sem avaliação levantada">RA —</span>`;
  if (r.ra_nota == null) return `<span class="pill" title="${esc(r.cuidado || "")}">RA ${esc(r.ra_selo || "sem índice")}</span>`;
  const n = r.ra_nota.toLocaleString("pt-BR", {minimumFractionDigits: 1, maximumFractionDigits: 1});
  return `<span class="pill ${repKind(r)}" title="Reclame Aqui: ${esc(r.ra_selo || "")} ${n}${r.ra_periodo ? " (" + esc(r.ra_periodo) + ")" : ""}">RA ${n}${short ? "" : " · " + esc(r.ra_selo || "")}</span>`; }

/* ---------- recomendação ---------- */
// custo-benefício: preço efetivo com penalidade pela reputação da loja; só ofertas confirmadas e com estoque
const PEN = {pos: 0, "": 0.03, warn: 0.05, neg: 0.08};
const repOf = loja => { const r = rep(loja); return r && r.ra_nota != null ? repKind(r) : ""; };
const score = o => eff(o) * (1 + (PEN[repOf(o.loja)] ?? 0.03));
function recommend(p) {
  const c = (p.ofertas || []).filter(usable); if (!c.length) return null;
  const o = c.reduce((a, x) => score(x) < score(a) ? x : a); const cheap = best(p);
  const r = rep(o.loja); const selo = r?.ra_selo ? `reputação ${r.ra_selo.toLowerCase()}` : "sem nota no Reclame Aqui";
  let why;
  if (cheap && cheap.o === o) why = repOf(o.loja) === "pos" ? `Menor preço e loja com ${selo}.` : `Menor preço, mas loja com ${selo}: compre com cartão.`;
  else { const cr = rep(cheap.o.loja); why = `${brl(eff(o) - cheap.v)} a mais que ${cheap.o.loja}, mas loja com ${selo}${cr?.ra_selo ? ` (a mais barata tem ${cr.ra_selo.toLowerCase()})` : " (a mais barata não tem nota)"}.`; }
  return {o, v: eff(o), why};
}
const recPill = (t = "Recomendada") => `<span class="pill rec">${t}</span>`;
function sortBar(attr, cur, opts) { return `<div class="seg" role="group" aria-label="Ordenar">${opts.map(([k, t]) => `<button ${attr}="${k}" aria-pressed="${k === cur}">${t}</button>`).join("")}</div>`; }

/* ---------- a régua: todas as lojas num eixo, o alvo marcado ---------- */
function ruler(p, {h = 44, labels = true} = {}) {
  const offers = (p.ofertas || []).filter(o => eff(o) != null && o.disponivel !== false);
  const b = best(p);
  if (!offers.length) return "";
  const vals = offers.map(eff).concat(hasGoal(p) ? [p.preco_alvo] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .06 || hi * .05; lo -= pad; hi += pad;
  const W = 300, X = v => 6 + (v - lo) / (hi - lo) * (W - 12), y = 18;
  let s = `<svg class="ruler" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" role="img" aria-label="Preço em ${offers.length} lojas, de ${brl(Math.min(...offers.map(eff)))} a ${brl(Math.max(...offers.map(eff)))}${hasGoal(p) ? ", alvo " + brl0(p.preco_alvo) : ""}">`;
  s += `<line x1="6" x2="${W - 6}" y1="${y}" y2="${y}" stroke="var(--chart-track)" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  if (hasGoal(p)) { const gx = X(p.preco_alvo); s += `<line x1="${gx}" x2="${gx}" y1="${y - 11}" y2="${y + 11}" stroke="var(--positive)" stroke-width="1.5" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>`; }
  if (b && hasGoal(p) && b.v > p.preco_alvo) s += `<line x1="${X(p.preco_alvo)}" x2="${X(b.v)}" y1="${y}" y2="${y}" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"><title>Faltam ${brl(b.v - p.preco_alvo)} para o alvo</title></line>`;
  for (const o of offers) { if (b && o === b.o) continue; const cx = X(eff(o)); const ok = o.verificado !== false;
    s += `<ellipse cx="${cx}" cy="${y}" rx="3.6" ry="3.6" fill="${ok ? "var(--chart-muted)" : "var(--ground)"}" stroke="var(--chart-muted)" stroke-width="1.2" vector-effect="non-scaling-stroke"><title>${esc(o.loja)}: ${brl(eff(o))}${ok ? "" : " (não confirmado)"}</title></ellipse>`; }
  if (b) s += `<ellipse cx="${X(b.v)}" cy="${y}" rx="5.5" ry="5.5" fill="var(--accent)"><title>${esc(b.o.loja)}: ${brl(b.v)}</title></ellipse>`;
  s += `</svg>`;
  if (!labels) return s;
  const mn = Math.min(...offers.map(eff)), mx = Math.max(...offers.map(eff));
  const g = hasGoal(p) ? p.preco_alvo : null;
  const left = g != null && g < mn ? `<span style="color:var(--positive)">alvo ${brl0(g)}</span>` : `<span>${brl0(mn)}</span>`;
  const right = g != null && g > mx ? `<span style="color:var(--positive)">alvo ${brl0(g)}</span>` : `<span>${brl0(mx)}</span>`;
  const mid = g != null && g >= mn && g <= mx ? `<span style="color:var(--positive)">alvo ${brl0(g)}</span>` : "";
  return s + `<div class="sub num" style="display:flex;justify-content:space-between;gap:8px;margin-top:-14px">${left}${mid}${right}</div>`;
}

function drawHistory(el, p) {

/* ---------- viagens ---------- */
const JAN = j => vmeta?.janelas?.[j] ? `${day(vmeta.janelas[j].ida)} a ${day(vmeta.janelas[j].volta)}` : j;
const rTotal = r => typeof r.total === "number" && r.total > 0 ? r.total : null;
function vbest(v) { let b = null; for (const r of v.rotas || []) { const t = rTotal(r); if (t != null && r.erro == null && (!b || t < b.total)) b = {...r, total: t}; } return b; }
const vhist = v => (v.historico || []).filter(h => typeof h.menor === "number").sort((a, b) => a.data < b.data ? -1 : 1);
const vAsP = v => ({ preco_alvo: v.preco_alvo, ofertas: (v.rotas || []).filter(r => rTotal(r) != null).map(r => ({loja: `${r.origem} · ${JAN(r.janela)} · ${r.fonte || ""}`, preco: rTotal(r), verificado: true})) });
const INS = {low: ["pos", "preço baixo"], typical: ["", "preço normal"], high: ["neg", "preço alto"]};
function insightPill(r) { const k = (r?.insight || "").toLowerCase(); const m = k.includes("low") ? INS.low : k.includes("high") ? INS.high : k.includes("typical") ? INS.typical : null;
  return m ? `<span class="pill ${m[0]}" title="Avaliação do Google Flights${r.faixa ? ": normalmente " + esc(r.faixa) : ""}">${m[1]}</span>` : ""; }
function vchg(v) { const h = vhist(v); if (h.length < 2) return `<div class="chg">1ª checagem</div>`; const c = h.at(-1).menor - h.at(-2).menor;
  return c === 0 ? `<div class="chg">igual a ontem</div>` : `<div class="chg ${c < 0 ? "good" : "bad"}">${signed(c)} vs ontem</div>`; }
const nStops = r => { const m = String(r.paradas || "").match(/(\d+)\s*parada/); return /direto/i.test(r.paradas || "") ? 0 : m ? +m[1] : null; };
const mins = r => { const m = String(r.duracao || "").match(/(\d+)h(\d+)?/); return m ? +m[1] * 60 + (+m[2] || 0) : null; };
const okKid = r => nStops(r) != null && nStops(r) <= 1 && (mins(r) ?? 999) <= 600 && !/\+1/.test(r.chegada || "") && !/madrugada/i.test(r.obs || "");
function recRoute(v) {
  const c = (v.rotas || []).filter(r => rTotal(r) != null && r.erro == null); if (!c.length) return null;
  const good = c.filter(okKid);
  if (good.length) { const r = good.reduce((a, x) => rTotal(x) < rTotal(a) ? x : a); const b = vbest(v);
    return {r, why: b && rTotal(r) > b.total ? `${brl(rTotal(r) - b.total)} a mais que a mais barata, mas com ${nStops(r) === 0 ? "voo direto" : "1 parada"} e ${r.duracao} de viagem, sem chegar de madrugada.` : `A mais barata e já boa com criança: ${nStops(r) === 0 ? "voo direto" : "1 parada"}, ${r.duracao}.`}; }
  return {r: null, why: "Nenhuma cotação com até 1 parada e 10h de viagem: todas são cansativas para uma criança de 3 anos."};
}

      <div><div class="k">Saindo de</div><div class="v">FLN · NVT</div><div class="s">Florianópolis e Navegantes</div></div>
    </section>
    <section class="card wl" aria-label="Destinos">
      <div class="wl-head"><span></span><span>Destino</span><span class="c-ruler">Todas as cotações</span><span class="n">Menor total</span><span class="n">Seu alvo</span><span></span></div>
      ${rows || `<div class="state">Nenhum destino cotado ainda.</div>`}
    </section>
    ${minas ? `<section class="card"><div class="card-h"><h2>Minas Gerais: onde ir chegando em ${esc(minas.aeroportos)}</h2><span class="meta">setembro é seca e céu aberto</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Cidade</th><th>Do aeroporto, de carro</th><th>Por que ir com criança</th></tr></thead><tbody>${minas.cidades.map(c => `<tr><td class="store"><b>${esc(c.cidade)}</b></td><td class="num" style="white-space:nowrap">${esc(c.carro || "")}</td><td>${esc(c.porque || "")}</td></tr>`).join("")}</tbody></table></div></section>` : ""}`;
}
function tripView(v) {
  const b = vbest(v); const h = vhist(v);
  const rr = recRoute(v);
  const tc = {rec: (x, y) => (okKid(y) - okKid(x)) || ((rTotal(x) ?? 1e12) - (rTotal(y) ?? 1e12)),
    preco: (x, y) => (rTotal(x) ?? 1e12) - (rTotal(y) ?? 1e12),
    duracao: (x, y) => (mins(x) ?? 1e6) - (mins(y) ?? 1e6),
    origem: (x, y) => x.origem.localeCompare(y.origem) || x.janela.localeCompare(y.janela) || ((rTotal(x) ?? 1e12) - (rTotal(y) ?? 1e12))}[tripSort] || (() => 0);
  const rows = [...(v.rotas || [])].sort(tc).map(r => { const t = rTotal(r); const isRec = rr?.r === r;
    return `<tr class="${b && t === b.total && r.origem === b.origem && r.janela === b.janela ? "best" : ""}">
      <td class="store"><span class="l"><b>${esc(r.origem)} → ${esc(r.destino_aero || (v.aeroportos || "").split(/[ ,/]/)[0])}</b>${isRec ? recPill("Recomendado") : ""}<span class="pill">${esc(r.fonte || "")}</span>${insightPill(r)}</span>
        <div class="sub">${isRec ? `<span style="color:var(--text)">${esc(rr.why)}</span> · ` : ""}${JAN(r.janela)} · ${esc([r.cia, r.saida && r.chegada ? `${r.saida}–${r.chegada}` : "", r.duracao, r.paradas].filter(Boolean).join(" · "))}${r.tipo ? " · " + esc(r.tipo) : ""}</div></td>
      <td class="n">${t != null ? brl(t) : `<span class="chg">${esc(r.erro || "sem preço")}</span>`}</td><td class="n">${t != null ? brl(t / 3) : "—"}</td>
      <td class="n">${safe(r.link) ? `<a class="ghost" href="${esc(r.link)}" target="_blank" rel="noopener noreferrer">Abrir ↗</a>` : ""}</td></tr>`; }).join("");
  const gap = b && typeof v.preco_alvo === "number" ? b.total - v.preco_alvo : null;
  $("#view").innerHTML = `
    <div class="title"><div><a class="back" href="#viagens">← Viagens</a><h1>${esc(v.destino)}${v.pais ? `, ${esc(v.pais)}` : ""}</h1><p>${esc(v.setembro || "")}</p></div>
      ${b && safe(b.link) ? `<a class="primary" href="${esc(b.link)}" target="_blank" rel="noopener noreferrer">Ver voo mais barato ↗</a>` : ""}</div>
    <div class="pv">
      <div class="stack">
        <section class="card"><div class="answer"><div><div style="color:var(--muted);font-size:13px">Menor total hoje · 2 adultos + criança</div><div class="price big num">${b ? brl(b.total) : "—"}</div>
          <div class="where">${b ? `saindo de <b>${esc(b.origem)}</b>, ${JAN(b.janela)} ${insightPill(b)}` : ""}</div>${vchg(v)}</div>
          <div style="text-align:right"><div style="color:var(--muted);font-size:13px">Por pessoa</div><div class="price num">${b ? brl(b.total / 3) : "—"}</div></div></div>
          ${rr ? `<div class="recline">${rr.r ? `${recPill("Recomendado")} <b>${esc(rr.r.origem)}, ${JAN(rr.r.janela)}</b> por <b class="num">${brl(rTotal(rr.r))}</b>` : `<span class="pill warn">sem opção boa com criança</span>`}<div class="sub">${esc(rr.why)}</div></div>` : ""}
          <div style="margin-top:18px">${ruler(vAsP(v))}</div>
          ${SAMPLE ? `<div class="target"><span class="msg">Alvo: <b class="num" style="color:var(--text)">${typeof v.preco_alvo === "number" ? brl0(v.preco_alvo) : "não definido"}</b>${gap != null ? (gap <= 0 ? " · já está no alvo" : ` · faltam ${brl(gap)}`) : ""}</span></div>` :
          `<div class="target"><label for="alvo">Seu alvo para os 3</label><input id="alvo" inputmode="decimal" autocomplete="off" value="${typeof v.preco_alvo === "number" ? v.preco_alvo.toLocaleString("pt-BR") : ""}" placeholder="ex. 7.000" aria-describedby="alvo-msg"><button class="ghost" id="save" type="button">Salvar</button><span class="msg ${gap != null && gap <= 0 ? "good" : ""}" id="alvo-msg">${gap == null ? "Avisamos quando chegar nesse valor." : gap <= 0 ? "Já está no alvo." : `Faltam ${brl(gap)} para o alvo.`}</span></div>`}
        </section>
        <section class="card"><div class="card-h"><h2>Com criança de 3 anos</h2></div><p class="note" style="margin:0;color:var(--text)">${esc(v.crianca || "")}</p>
          ${(v.cidades || []).length ? `<ul class="specs" style="margin-top:14px">${v.cidades.map(c => `<li><b>${esc(c.cidade)}</b> · ${esc(c.carro || "")}<div class="sub">${esc(c.porque || "")}</div></li>`).join("")}</ul>` : ""}</section>
      </div>
      <div class="stack">
        <section class="card"><div class="card-h"><h2>Menor total por dia</h2><span class="meta">${h.length} ${h.length === 1 ? "checagem" : "checagens"}</span></div><div class="chart" id="chart"></div></section>
        <section class="card"><div class="card-h"><h2>Cotações</h2>${sortBar("data-tsort", tripSort, [["rec", "Recomendação"], ["preco", "Menor total"], ["duracao", "Mais rápido"], ["origem", "Saída"]])}</div>
          <p class="sub" style="margin:-6px 0 10px">Total para 3 pessoas, ida e volta · recomendado: mais barato com até 1 parada, até 10h e sem chegada de madrugada</p>
          <div class="tbl-wrap"><table><thead><tr><th>Trecho</th><th class="n">Total</th><th class="n">Por pessoa</th><th class="n"><span hidden>Link</span></th></tr></thead><tbody>${rows}</tbody></table></div></section>
      </div>
    </div>`;
  drawHistory($("#chart"), {nome: v.destino, preco_alvo: v.preco_alvo, historico: h.map(x => ({data: x.data, menor: x.menor, loja: `${x.origem || ""} ${x.janela ? JAN(x.janela) : ""}`.trim()}))});
  if (!SAMPLE) { const save = async () => { const raw = $("#alvo").value.trim().replace(/[R$\s]/g, "").replace(/\./g, "").replace(",", "."); const val = raw === "" ? null : Number(raw);
      if (raw !== "" && (!isFinite(val) || val <= 0)) { $("#alvo-msg").textContent = "Digite um valor em reais, por exemplo 7.000."; return; }
      if (!db) { toast("Abra a página logado no Claude para salvar."); return; }
      try { await db.doc("viagens/" + v.id).update({preco_alvo: val}); toast(val == null ? "Alvo removido" : "Alvo salvo: " + brl0(val)); } catch (e) { toast("Não deu para salvar (" + (e.code || "erro") + ")."); } };
    $("#save").addEventListener("click", save); $("#alvo").addEventListener("keydown", e => { if (e.key === "Enter") save(); }); }
}

/* ---------- lojas ---------- */
function storesView() {
  const used = new Set(); for (const p of products) for (const o of p.ofertas || []) { const r = rep(o.loja); used.add(r ? r.nome : o.loja); }
  const names = [...used].sort((a, b) => ((lojas[b]?.ra_nota ?? -1) - (lojas[a]?.ra_nota ?? -1)) || a.localeCompare(b));
  const pct = v => v == null ? "—" : v.toLocaleString("pt-BR", {maximumFractionDigits: 1}) + "%";
  const rows = names.map(n => { const r = lojas[n] || {}; const cnt = products.reduce((s, p) => s + (p.ofertas || []).filter(o => { const x = rep(o.loja); return (x ? x.nome : o.loja) === n; }).length, 0);
    return `<tr><td class="store"><span class="l"><b>${esc(n)}</b></span><div class="sub">${esc(r.cuidado || "")}${r.outras ? " · " + esc(r.outras) : ""}</div></td>
      <td class="n">${r.ra_nota != null ? repPill(n, true) : "—"}</td><td>${esc(r.ra_selo || "—")}</td>
      <td class="n">${pct(r.respondidas_pct)}</td><td class="n">${pct(r.solucao_pct)}</td><td class="n">${pct(r.voltariam_pct)}</td>
      <td class="n num">${cnt}</td><td class="n">${safe(r.ra_url) ? `<a class="ghost" href="${esc(r.ra_url)}" target="_blank" rel="noopener noreferrer">Reclame Aqui ↗</a>` : ""}</td></tr>`; }).join("");
  const bad = names.filter(n => ["warn", "neg"].includes(repKind(lojas[n] ? {nome: n, ...lojas[n]} : null)));
  $("#view").innerHTML = `<div class="title"><div><h1>Lojas</h1><p>${bad.length ? `<b>${esc(bad.join(", "))}</b> ${bad.length > 1 ? "têm" : "tem"} reputação fraca no Reclame Aqui: prefira outra loja se o preço for parecido.` : "Todas as lojas da lista têm reputação boa ou ótima no Reclame Aqui."} Em marketplace a nota é da plataforma: confira também o vendedor do anúncio. As notas vêm de resumos públicos do Reclame Aqui; abra o link para ver a nota do dia.</p></div>
    <span class="stamp">Reclame Aqui, últimos 6 meses · levantado ${stamp(lojasAt)}</span></div>
    <section class="card"><div class="tbl-wrap"><table><thead><tr><th>Loja</th><th class="n">Nota</th><th>Selo</th><th class="n">Respondidas</th><th class="n">Resolvidas</th><th class="n">Voltariam</th><th class="n">Ofertas</th><th class="n"><span hidden>Link</span></th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

/* ---------- produto ---------- */
function productView(p) {
  const b = best(p);
  const rc = recommend(p);
  const cmp = {
    rec: (x, y) => (usable(y) - usable(x)) || ((usable(x) ? score(x) : eff(x) ?? 1e12) - (usable(y) ? score(y) : eff(y) ?? 1e12)),
    preco: (x, y) => (eff(x) ?? 1e12) - (eff(y) ?? 1e12),
    rep: (x, y) => ((rep(y.loja)?.ra_nota ?? -1) - (rep(x.loja)?.ra_nota ?? -1)) || ((eff(x) ?? 1e12) - (eff(y) ?? 1e12)),
    loja: (x, y) => x.loja.localeCompare(y.loja, "pt-BR")}[offerSort] || ((x, y) => 0);
  const offers = [...(p.ofertas || [])].sort(cmp);
  const h = hist(p);
  const low = h.length ? Math.min(...h.map(x => x.menor)) : null;
  const gap = b && hasGoal(p) ? b.v - p.preco_alvo : null;
  const rows = offers.map(o => { const prev = prevStore(p, o.loja), v = eff(o); const ch = prev != null && v != null ? v - prev : null;
    const tags = (o.verificado === false ? `<span class="pill warn">não confirmado</span>` : "") + (o.disponivel === false ? `<span class="pill neg">esgotado</span>` : "");
    const isRec = rc && o === rc.o;
    return `<tr class="${b && o === b.o ? "best" : ""}">
      <td class="store"><span class="l"><b>${esc(o.loja)}</b>${isRec ? recPill() : ""}${repPill(o.loja, true)}${tags}</span><div class="sub">${isRec ? `<span style="color:var(--text)">${esc(rc.why)}</span> · ` : ""}${esc([o.parcelas, o.obs].filter(Boolean).join(" · "))}</div></td>
      <td class="n">${brl(o.preco)}</td><td class="n">${o.preco_pix ? brl(o.preco_pix) : "—"}</td>
      <td class="n">${ch == null ? `<span class="chg">—</span>` : ch === 0 ? `<span class="chg">igual</span>` : `<span class="chg ${ch < 0 ? "good" : "bad"}">${signed(ch)}</span>`}</td>
      <td class="n">${safe(o.url) ? `<a class="ghost" href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">Abrir ↗</a>` : ""}</td></tr>`; }).join("");
  $("#view").innerHTML = `
    <div class="title"><div><a class="back" href="#">← Lista de desejos</a><h1>${esc(p.nome)}</h1><p>${esc(p.resumo || "")}</p></div>
      ${rc && safe(rc.o.url) ? `<a class="primary" href="${esc(rc.o.url)}" target="_blank" rel="noopener noreferrer">Comprar na ${esc(rc.o.loja)} ↗</a>` : ""}</div>
    <div class="pv">
      <div class="stack">
        <div class="photo">${p.imagem ? `<img src="${esc(p.imagem)}" alt="${esc(p.nome)}">` : ""}</div>
        <section class="card"><div class="card-h"><h2>Ficha técnica</h2></div><ul class="specs">${(p.specs || []).map(s => `<li>${esc(s)}</li>`).join("")}</ul>${p.nota ? `<p class="note">${esc(p.nota)}</p>` : ""}</section>
      </div>
      <div class="stack">
        <section class="card">
          <div class="answer"><div><div class="k" style="color:var(--muted);font-size:13px">Menor preço hoje</div><div class="price big num">${b ? brl(b.v) : "—"}</div>
            <div class="where">${b ? `em <b>${esc(b.o.loja)}</b>${b.o.preco_pix && b.v === b.o.preco_pix ? " no Pix" : ""} ${repPill(b.o.loja)}` : "nenhuma loja com preço confirmado"}</div>${chgLine(p)}
            ${rc ? `<div class="recline">${recPill()} <b>${esc(rc.o.loja)}</b> por <b class="num">${brl(rc.v)}</b><div class="sub">${esc(rc.why)}</div></div>` : ""}</div>
            <div style="text-align:right"><div class="k" style="color:var(--muted);font-size:13px">Menor já visto</div><div class="price num">${brl(low)}</div><div class="sub">desde ${day(h[0]?.data)}</div></div></div>
          <div style="margin-top:18px">${ruler(p, {h: 44})}</div>
          ${SAMPLE ? `<div class="target"><span class="msg">Alvo: <b class="num" style="color:var(--text)">${hasGoal(p) ? brl0(p.preco_alvo) : "não definido"}</b>${gap != null ? (gap <= 0 ? " · já está no alvo" : ` · faltam ${brl(gap)}`) : ""}</span></div>` : `<div class="target"><label for="alvo">Seu preço-alvo</label><input id="alvo" inputmode="decimal" autocomplete="off" value="${hasGoal(p) ? p.preco_alvo.toLocaleString("pt-BR") : ""}" placeholder="ex. 2.300" aria-describedby="alvo-msg">
            <button class="ghost" id="save" type="button">Salvar</button>
            <span class="msg ${gap != null && gap <= 0 ? "good" : ""}" id="alvo-msg">${gap == null ? "Avisamos quando alguma loja chegar nesse valor." : gap <= 0 ? "Já está no alvo." : `Faltam ${brl(gap)} para o alvo.`}</span></div>`}
        </section>
        <section class="card"><div class="card-h"><h2>Menor preço por dia</h2><span class="meta">${h.length} ${h.length === 1 ? "checagem" : "checagens"}</span></div><div class="chart" id="chart"></div></section>
        <section class="card"><div class="card-h"><h2>Preço em cada loja</h2>${sortBar("data-osort", offerSort, [["rec", "Recomendação"], ["preco", "Menor preço"], ["rep", "Reputação"], ["loja", "Loja"]])}</div>
          <p class="sub" style="margin:-6px 0 10px">Pix quando a loja informa · variação vs a checagem anterior · a recomendada pesa preço e reputação no Reclame Aqui</p>
          <div class="tbl-wrap"><table><thead><tr><th>Loja</th><th class="n">Preço</th><th class="n">Pix</th><th class="n">Vs ontem</th><th class="n"><span hidden>Link</span></th></tr></thead><tbody>${rows}</tbody></table></div></section>
      </div>
    </div>`;
  drawHistory($("#chart"), p);
  if (!SAMPLE) { $("#save").addEventListener("click", () => saveGoal(p));
  $("#alvo").addEventListener("keydown", e => { if (e.key === "Enter") saveGoal(p); }); }
}

async function saveGoal(p) {
  const raw = $("#alvo").value.trim().replace(/[R$\s]/g, "").replace(/\./g, "").replace(",", ".");
  const v = raw === "" ? null : Number(raw);
  if (raw !== "" && (!isFinite(v) || v <= 0)) { $("#alvo-msg").textContent = "Digite um valor em reais, por exemplo 2.300."; return; }
  if (!db) { toast("Abra a página logado no Claude para salvar."); return; }
  try { await db.doc("produtos/" + p.id).update({preco_alvo: v}); toast(v == null ? "Alvo removido" : "Alvo salvo: " + brl0(v)); }
  catch (e) { toast("Não deu para salvar (" + (e.code || "erro") + ")."); }
}

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 2200); }

function render() {
  const d = Math.ceil((BF - Date.now()) / 864e5);
  $("#days").textContent = d > 0 ? d : d > -4 ? "hoje" : "—";
  if (!loaded) return;
  renderNav();
  const id = route(); const p = id && products.find(x => x.id === id);
  $("#crumb").innerHTML = p ? `<a href="#">Lista de desejos</a><span class="sep">/</span><b>${esc(p.curto || p.nome)}</b>` : onStores() ? `<b>Lojas e reputação</b>` : `<b>Lista de desejos</b>`;
  const tv = tripId() && viagens.find(x => x.id === tripId());
  if (tv) $("#crumb").innerHTML = `<a href="#viagens">Viagens</a><span class="sep">/</span><b>${esc(tv.curto || tv.destino)}</b>`;
  else if (onTrips()) $("#crumb").innerHTML = `<b>Viagens</b>`;
  if (p) productView(p); else if (tv) tripView(tv); else if (onTrips()) tripsView(); else if (onStores()) storesView(); else overview();
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-stop]")) return;
  const os = e.target.closest("[data-osort]"); if (os) { offerSort = os.dataset.osort; try { localStorage.setItem("rbf-osort", offerSort); } catch (x) {} render(); return; }
  const ts = e.target.closest("[data-tsort]"); if (ts) { tripSort = ts.dataset.tsort; try { localStorage.setItem("rbf-tsort", tripSort); } catch (x) {} render(); return; }
  const pk = e.target.closest("[data-pick]"); if (pk) { chartPick = pk.dataset.pick; overview(); return; }
  const r = e.target.closest("[data-go]"); if (r) { location.hash = "p-" + r.dataset.go; return; }
  const tr = e.target.closest("[data-trip]"); if (tr) { location.hash = "v-" + tr.dataset.trip; return; }
  if (e.target.closest(".side a")) closeMenu();
});
document.addEventListener("keydown", e => { const r = e.target.closest?.("[data-go]"); if (r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); location.hash = "p-" + r.dataset.go; }
  const tr = e.target.closest?.("[data-trip]"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); location.hash = "v-" + tr.dataset.trip; } if (e.key === "Escape") closeMenu(); });
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
const openMenu = () => { $("#side").classList.add("open"); $("#menu").setAttribute("aria-expanded", "true"); };
const closeMenu = () => { $("#side").classList.remove("open"); $("#menu").setAttribute("aria-expanded", "false"); };
$("#menu").addEventListener("click", openMenu); $("#close").addEventListener("click", closeMenu);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const el = $("#chart"); if (!el || !loaded) return; const id = route(); const p = id ? products.find(x => x.id === id) : products.find(x => x.id === chartPick); if (p) drawHistory(el, p); }, 150); });

const SAMPLE = /*SAMPLE*/null;
(async () => {
  render();
  if (SAMPLE) { products = SAMPLE.produtos; meta = SAMPLE.meta; viagens = SAMPLE.viagens || []; vmeta = SAMPLE.vmeta || null; lojas = SAMPLE.lojas || {}; lojasAt = SAMPLE.lojasAt || null; loaded = true; render(); return; }
  const timer = setTimeout(() => { if (!loaded) $("#view").innerHTML = `<div class="title"><div><h1>Lista de desejos</h1><p>Os preços não carregaram. Recarregue a página logado no Claude.</p></div></div>`; }, 10000);
  db = await window.claude?.use?.("db");
  if (!db) { clearTimeout(timer); $("#view").innerHTML = `<div class="title"><div><h1>Lista de desejos</h1><p>Abra esta página logado no Claude para ver seus preços.</p></div></div>`; return; }
  db.collection("produtos").onSnapshot(s => { clearTimeout(timer); loaded = true; products = s.docs.map(d => ({id: d.id, ...d.data()})); render(); },
    e => { clearTimeout(timer); $("#view").innerHTML = `<div class="title"><div><h1>Lista de desejos</h1><p>Não consegui carregar os preços (${esc(e.code)}). Recarregue a página.</p></div></div>`; });
  db.doc("meta/status").onSnapshot(s => { meta = s.exists ? s.data() : null; if (loaded) render(); }, () => {});
  db.collection("viagens").onSnapshot(s => { viagens = s.docs.map(d => ({id: d.id, ...d.data()})); if (loaded) render(); }, () => {});
  db.doc("meta/viagens").onSnapshot(s => { vmeta = s.exists ? s.data() : null; if (loaded) render(); }, () => {});
  db.doc("meta/lojas").onSnapshot(s => { lojas = s.exists ? (s.data().lojas || {}) : {}; lojasAt = s.exists ? s.data().atualizado : null; if (loaded) render(); }, () => {});
})();
</script>
